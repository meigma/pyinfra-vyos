version: 2

# `cooldown` holds a newly published release back for a week before Dependabot
# will propose it. A compromised or yanked release is usually caught within
# that window, so the delay keeps this repository off the leading edge of a
# supply-chain incident without leaving updates unattended.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - python

  - package-ecosystem: uv
    directory: /docs
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - documentation
