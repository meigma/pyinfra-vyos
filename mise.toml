# mise: tool and environment management for pyinfra-vyos.
#
# Tool releases use mise's verifying Aqua backend. The committed mise.lock
# records per-platform download URLs and checksums, and locked mode makes
# installation fail closed when the current platform is not represented.
#
# Bump a tool by updating its version here, then run:
#   mise lock --platform linux-x64,linux-arm64,macos-x64,macos-arm64
# Commit mise.toml and mise.lock together.

[tools]
# Python runtime and project/environment management. Keep this in sync with
# .python-version; requires-python in pyproject.toml stays lower (>=3.11) so
# generated packages remain installable on older interpreters.
python = "3.14.7"
"aqua:astral-sh/uv" = "0.11.19"

# Task runner and CI gate. Moon runs mise-managed binaries through its system
# toolchain rather than installing a second copy of Python or uv.
"aqua:moonrepo/moon" = "2.4.4"

[settings]
lockfile = true
locked = true
